name: Social Scheduler

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-scheduler
  cancel-in-progress: false

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run scheduler
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node scheduler.js

      - name: Commit scheduler state and logs
        run: |
          git config user.name "GitHub Scheduler"
          git config user.email "actions@github.com"
          git add posts.json logs.json media
          if git diff --cached --quiet; then
            echo "No scheduler changes to commit."
          else
            git commit -m "Update scheduler state and logs"
            git push
          fi
